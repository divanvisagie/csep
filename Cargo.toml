[package]
name = "csep"
version = "0.1.9"
edition = "2021"
authors = ["Divan Visagie <me@divanv.com>"]
license = "GPL-2.0"
description = "Cosine Similarity Embeddings Print"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
atty = "0.2.14"
bincode = "1.3.3"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "5.0.1"
fastembed = "4.9.1"
futures = "0.3.31"
ignore = "0.4.25"
memmap2 = "0.9.9"
openssl = { version = "0.10.75", features = ["vendored"] }
rayon = "1.11.0"
reqwest = { version = "0.12.26" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
spinners = "4.1.1"
text-splitter = { version = "0.18.1", features = ["tiktoken-rs"] }
tiktoken-rs = "0.6.0"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
