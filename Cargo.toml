[package]
name = "csep"
version = "0.3.0"
edition = "2021"
authors = ["Divan Visagie <me@divanv.com>"]
license = "GPL-2.0"
description = "Cosine Similarity Embeddings Print"

[features]
default = []
cuda = ["fastembed/cuda", "candle-core/cuda"]
metal = ["fastembed/metal", "candle-core/metal"]

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
atty = "0.2.14"
libsql = { version = "0.6", default-features = false, features = ["core"] }
candle-core = { version = "0.9", optional = true }
clap = { version = "4.5.53", features = ["derive"] }

fastembed = "5.8"
futures = "0.3.31"
ignore = "0.4.25"
memmap2 = "0.9.9"
openssl = { version = "0.10.75", features = ["vendored"] }
rayon = "1.11.0"
reqwest = { version = "0.12.26" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
spinners = "4.1.1"
text-splitter = { version = "0.18.1", features = ["tiktoken-rs"] }
tiktoken-rs = "0.6.0"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
